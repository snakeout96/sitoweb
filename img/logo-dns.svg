<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
  </defs>
  <rect width="600" height="300" fill="#eaf3fb"/>
  <text x="300" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f4e79">Il DNS e' la rubrica di Internet</text>
  <rect x="30" y="100" width="210" height="80" rx="10" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/>
  <text x="135" y="135" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">nome (facile da ricordare)</text>
  <text x="135" y="160" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f4e79">www.example.com</text>
  <rect x="360" y="100" width="210" height="80" rx="10" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/>
  <text x="465" y="135" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">indirizzo IP (per le macchine)</text>
  <text x="465" y="160" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f4e79">192.0.2.10</text>
  <line x1="245" y1="140" x2="355" y2="140" stroke="#1f4e79" stroke-width="3" marker-end="url(#a)"/>
  <text x="300" y="128" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#c0392b">DNS</text>
  <text x="300" y="250" font-family="Arial" font-size="15" text-anchor="middle" fill="#444">Domain Name System: traduce i nomi in indirizzi</text>
</svg>
